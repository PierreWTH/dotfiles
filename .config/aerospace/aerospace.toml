config-version = 2
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7"]

# Docs : https://nikitabobko.github.io/AeroSpace/guide
# Commandes : https://nikitabobko.github.io/AeroSpace/commands

start-at-login = true
after-login-command = []
after-startup-command = []

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 50
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        0
    outer.right =      10

[mode.main.binding]
    alt-a = 'layout accordion tiles'   # bascule accordéon <-> côte à côte
    alt-f = 'fullscreen'               # met la fenêtre active en plein écran, et la remet en place
    alt-r = 'flatten-workspace-tree'   # remet le layout à zéro directement

    # Focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # Déplacer la fenêtre
    ctrl-shift-h = 'move left'
    ctrl-shift-j = 'move down'
    ctrl-shift-k = 'move up'
    ctrl-shift-l = 'move right'

    # Redimensionner
    ctrl-cmd-l = 'resize smart -50'
    ctrl-cmd-h = 'resize smart +50'

    # Aller au workspace
    cmd-1 = 'workspace 1'
    cmd-2 = 'workspace 2'
    cmd-3 = 'workspace 3'
    cmd-4 = 'workspace 4'
    cmd-5 = 'workspace 5'
    cmd-6 = 'workspace 6'
    cmd-7 = 'workspace 7'

    # Envoyer la fenêtre vers un workspace
    shift-cmd-1 = 'move-node-to-workspace 1'
    shift-cmd-2 = 'move-node-to-workspace 2'
    shift-cmd-3 = 'move-node-to-workspace 3'
    shift-cmd-4 = 'move-node-to-workspace 4'
    shift-cmd-5 = 'move-node-to-workspace 5'
    shift-cmd-6 = 'move-node-to-workspace 6'
    shift-cmd-7 = 'move-node-to-workspace 7'

    alt-tab = 'workspace-back-and-forth'
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    alt-shift-semicolon = 'mode service'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main']   # réinitialiser le layout
    f = ['layout floating tiling', 'mode main']   # flottant <-> tiling
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']

# Apps -> workspaces
[[on-window-detected]]
    if.app-id = 'md.obsidian'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'app.zen-browser.zen'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'com.spotify.client'
    run = 'move-node-to-workspace 7'

# Workspaces -> écrans
[workspace-to-monitor-force-assignment]
    1 = 'main'
    2 = 'main'
    3 = 'main'
    4 = 'main'
    5 = 'main'
    6 = 'secondary'
    7 = 'secondary'
